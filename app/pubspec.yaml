name: offline_agent
description: Native Offline Agent App – lokale KI-Agenten ohne Cloud und ohne App Store.
version: 1.58.0+92
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  agent_engine:
    path: ../packages/agent_engine
  path_provider: ^2.1.5
  file_picker: ^10.3.0
  wakelock_plus: ^1.3.0
  # Sprache: Aufnahme, Piper-TTS (sherpa-onnx), Wiedergabe, Entpacken der Stimmen
  record: ^7.0.0
  # 1.13.8 fest: ab 2.0 liest sherpa-onnx keine espeak-Daten mehr, Piper bliebe stumm
  sherpa_onnx: 1.13.8
  audioplayers: ^6.5.0
  archive: ^4.0.7
  # Systemstimme als Rückfallebene für das Vorlesen (offline, vom Betriebssystem)
  flutter_tts: ^4.2.0
  # Eingebauter Browser, den der Agent bedient (Android WebView / macOS WKWebView)
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/vad/silero_vad.onnx
    - assets/help/
    - assets/ai_label/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

dependency_overrides:
  # 2.3.x nutzt JNI und stürzt beim Start ab (ClassNotFoundException android/content/Context)
  path_provider_android: 2.2.23
