name: Marketing-Bilder

# Echte App-Bilder für die Webseite (hell & warm, doppelte Auflösung) – als Artefakt „marketing-bilder“.
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bilder rendern
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter pub get
          mkdir -p test/ux
          flutter test test/ux_shots_test.dart --plain-name 'Marketing-Bilder' --update-goldens --reporter expanded 2>&1 | grep -E "Bild|Error|error" | head -60 || true
          ls -la test/ux
      - uses: actions/upload-artifact@v6
        with:
          name: marketing-bilder
          path: app/test/ux/m_*.png
          if-no-files-found: warn
          retention-days: 5
      - name: Bilder ins Log (base64)
        working-directory: app
        run: |
          for f in test/ux/m_*.png; do echo "IMG-BEGIN $(basename $f)"; base64 -w 3000 "$f"; echo "IMG-END"; done
