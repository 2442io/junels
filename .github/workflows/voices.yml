name: Stimmen

# Baut zusätzliche Stimmenpakete (Kokoro) und legt sie im Release „stimmen“ ab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/voices/**', '.github/workflows/voices.yml']

permissions:
  contents: write

jobs:
  piper-liste:
    runs-on: ubuntu-latest
    steps:
      - name: Deutsche Piper-Stimmen bei sherpa-onnx auflisten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/k2-fsa/sherpa-onnx/releases/tags/tts-models" -q '.assets[]|select(.name|test("de_DE|german";"i"))|.name+" "+((.size/1048576|floor)|tostring)+"MB"' || true

  kokoro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        voice: [martin, victoria]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Werkzeuge
        run: pip install onnx numpy huggingface_hub sherpa-onnx==1.13.8 faster-whisper
      - name: Paket bauen
        run: python scripts/voices/build_kokoro.py kokoro-de-${{ matrix.voice }} ${{ matrix.voice }}
      - name: Prüfen (Sprechen und mit Whisper zurückerkennen)
        run: python scripts/voices/test_voice.py kokoro-de-${{ matrix.voice }}
      - name: Packen
        run: |
          tar -cjf kokoro-de-${{ matrix.voice }}.tar.bz2 kokoro-de-${{ matrix.voice }}
          ls -la kokoro-de-${{ matrix.voice }}.tar.bz2
      - name: Hörprobe aufheben
        uses: actions/upload-artifact@v4
        with:
          name: hoerprobe-${{ matrix.voice }}
          path: probe.wav
      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view stimmen >/dev/null 2>&1 || gh release create stimmen --title "Stimmen" --notes "Zusätzliche Stimmen für Junels (Kokoro)." --prerelease
          gh release upload stimmen kokoro-de-${{ matrix.voice }}.tar.bz2 --clobber
