name: Hilfe-Bildschirmfotos

# Rendert die Hilfe-Bilder (app/assets/help/*.png) mit Beispieldaten – zum Prüfen als Artefakt.
# Der eigentliche App-Build erzeugt sie bei jedem Lauf selbst.
on:
  workflow_dispatch:
  push:
    branches: [redesign]

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bilder rendern
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter test test/help_screenshots_test.dart --update-goldens --reporter expanded 2>&1 | tail -80
          ls -la assets/help
          for f in assets/help/*.png; do echo "IMG-BEGIN $(basename $f)"; base64 -w0 "$f"; echo; echo "IMG-END"; done
      - uses: actions/upload-artifact@v6
        with:
          name: hilfe-bilder
          path: app/assets/help/*.png
          if-no-files-found: warn
          retention-days: 7
