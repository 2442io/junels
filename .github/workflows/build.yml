# Baut bei jedem Push die Android-APK und die macOS-DMG.
# Jeder erfolgreiche Build auf main ersetzt die Dateien im Release "aktuell":
#   https://github.com/2442io/junels/releases/tag/aktuell  (Junels.apk, Junels.dmg)
# Bei einem Tag (z. B. v1.1.0) zusätzlich als eigenes GitHub-Release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Reine Stimmen-Pakete brauchen keinen App-Build
    paths-ignore: ['scripts/voices/**', '.github/workflows/voices.yml', 'scripts/names/**', '.github/workflows/names.yml', '.github/workflows/help-shots.yml']
  workflow_dispatch:

# Ein neuerer Push bricht ältere Builds ab – sonst könnte ein älterer, später fertiger
# Build die neueren Dateien im Release „aktuell“ überschreiben.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Android-APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h / | tail -1
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Quellen
        uses: actions/cache@v5
        with:
          path: third_party
          key: src-${{ hashFiles('scripts/fetch_llama.sh', 'scripts/slim_sd_vocab.py') }}
      - name: Cache native Objektdateien
        uses: actions/cache@v5
        with:
          path: packages/agent_engine/android/.cxx
          key: cxx-android-${{ hashFiles('scripts/fetch_llama.sh', 'packages/agent_engine/src/**') }}
          restore-keys: cxx-android-
      - name: Quellen holen (llama.cpp, whisper.cpp, stable-diffusion.cpp)
        run: bash scripts/fetch_llama.sh
      - name: Plattform anlegen und anpassen
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter create --platforms=android --org io.t24 --project-name offline_agent --no-pub .
          python3 ../scripts/patch_platforms.py .
          flutter pub get
      - name: Signatur-Schlüssel
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::Kein fester Schlüssel (Secret ANDROID_KEYSTORE_B64) – Updates erfordern Neuinstallation"
            exit 0
          fi
          # Leerzeichen/Zeilenumbrüche vom Kopieren entfernen
          printf %s "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/junels.jks"
          PW="$(printf %s "$PW" | tr -d ' \r\n\t')"
          echo "Keystore: $(wc -c < "$RUNNER_TEMP/junels.jks") Bytes, Passwort: ${#PW} Zeichen"
          if ! keytool -list -keystore "$RUNNER_TEMP/junels.jks" -storepass "$PW" -alias junels > /dev/null 2>&1; then
            echo "::error::Keystore oder Passwort passen nicht zusammen. Bitte die Secrets ANDROID_KEYSTORE_B64 und ANDROID_KEY_PASSWORD prüfen (Wert vollständig kopiert?)."
            keytool -list -keystore "$RUNNER_TEMP/junels.jks" -storepass "$PW" 2>&1 | tail -3
            exit 1
          fi
          echo "JUNELS_KEYSTORE=$RUNNER_TEMP/junels.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$PW"
          echo "JUNELS_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
      - name: APK bauen
        run: bash scripts/build_android.sh
      - uses: actions/upload-artifact@v6
        with:
          name: OfflineAgent-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Release "aktuell" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/*.apk dist/Junels.apk
          NOTES="Immer die neueste Version. Stand: $(date -u '+%Y-%m-%d %H:%M') UTC, Commit ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          for i in 1 2 3; do
            gh release view aktuell >/dev/null 2>&1 && break
            gh release create aktuell --title "Aktuelle Version" --notes "$NOTES" --target main && break
            sleep 10
          done
          VER=$(grep '^version:' app/pubspec.yaml | awk '{print $2}')
          python3 -c "import json,sys; v=sys.argv[1]; print(json.dumps({'version': v.split('+')[0], 'build': int(v.split('+')[1]), 'commit': sys.argv[2], 'date': sys.argv[3], 'notes': sys.argv[4]}))" "$VER" "${GITHUB_SHA::7}" "$(date -u '+%Y-%m-%d %H:%M')" "$(git log -1 --format=%s)" > dist/version-android.json
          gh release upload aktuell dist/Junels.apk server/junels-sync.php --clobber
          gh release upload aktuell dist/version-android.json --clobber
          gh release edit aktuell --notes "$NOTES"
      - name: Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

  macos:
    name: macOS-DMG
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Werkzeuge
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          flutter config --no-analytics
      - name: Cache Metal-Framework
        uses: actions/cache@v5
        with:
          path: packages/agent_engine/macos/Frameworks/AgentEngine.xcframework
          key: xcf-macos-${{ hashFiles('scripts/fetch_llama.sh', 'scripts/slim_sd_vocab.py', 'scripts/build_apple_framework.sh', 'packages/agent_engine/src/**') }}
      - name: Einrichten (inkl. Metal-Framework, nur macOS-Variante)
        env:
          AE_APPLE_TARGETS: macos
          AE_REUSE_FRAMEWORK: '1'
        run: bash scripts/setup.sh
      - name: Signatur-Zertifikat
        env:
          P12: ${{ secrets.MACOS_CERT_P12_B64 }}
          PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "::warning::Kein Zertifikat (Secret MACOS_CERT_P12_B64) – ad-hoc signiert"; exit 0; fi
          KC="$RUNNER_TEMP/junels.keychain-db"
          KPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/c.p12"
          security import "$RUNNER_TEMP/c.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "Junels Code Signing" -p "$KC" > "$RUNNER_TEMP/c.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/c.pem"
          security find-identity -p codesigning "$KC"
          echo "MAC_SIGN_IDENTITY=Junels Code Signing" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/c.p12"
      - name: DMG bauen
        run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v6
        with:
          name: OfflineAgent-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Release "aktuell" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/*.dmg dist/Junels.dmg
          NOTES="Immer die neueste Version. Stand: $(date -u '+%Y-%m-%d %H:%M') UTC, Commit ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          for i in 1 2 3; do
            gh release view aktuell >/dev/null 2>&1 && break
            gh release create aktuell --title "Aktuelle Version" --notes "$NOTES" --target main && break
            sleep 10
          done
          VER=$(grep '^version:' app/pubspec.yaml | awk '{print $2}')
          python3 -c "import json,sys; v=sys.argv[1]; print(json.dumps({'version': v.split('+')[0], 'build': int(v.split('+')[1]), 'commit': sys.argv[2], 'date': sys.argv[3], 'notes': sys.argv[4]}))" "$VER" "${GITHUB_SHA::7}" "$(date -u '+%Y-%m-%d %H:%M')" "$(git log -1 --format=%s)" > dist/version-macos.json
          gh release upload aktuell dist/Junels.dmg --clobber
          gh release upload aktuell dist/version-macos.json --clobber
          gh release edit aktuell --notes "$NOTES"
      - name: Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  engine-test:
    # Prüft Bildverständnis, Bildgenerierung und alle Download-Adressen mit echten Modellen.
    # Blockiert die App-Builds nicht.
    name: Engine-Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - name: Cache Quellen
        uses: actions/cache@v5
        with:
          path: third_party
          key: src-${{ hashFiles('scripts/fetch_llama.sh', 'scripts/slim_sd_vocab.py') }}
      - name: Cache Build
        uses: actions/cache@v5
        with:
          path: build-linux
          key: linux-${{ hashFiles('scripts/fetch_llama.sh', 'packages/agent_engine/src/**') }}
          restore-keys: linux-
      - name: Cache Testmodelle
        uses: actions/cache@v5
        with:
          path: testmodels
          key: testmodels-v2
      - name: Engine bauen
        run: |
          bash scripts/fetch_llama.sh
          cmake -S packages/agent_engine/src -B build-linux -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build build-linux --target agent_engine -j 4 2>&1 | tail -3
      - name: Testmodelle laden
        run: bash scripts/ci_testmodels.sh testmodels
      - name: Tests
        working-directory: packages/agent_engine
        run: |
          set -o pipefail
          export AE_LIB_PATH=$GITHUB_WORKSPACE/build-linux/libagent_engine.so
          # PHP-Sync-Server für den Abgleich-Test
          mkdir -p /tmp/syncsrv && cp $GITHUB_WORKSPACE/server/junels-sync.php /tmp/syncsrv/
          if command -v php >/dev/null; then
            (php -S 127.0.0.1:8765 -t /tmp/syncsrv > /tmp/syncsrv.log 2>&1 &)
            sleep 1
            export AE_TEST_SYNC_URL=http://127.0.0.1:8765/junels-sync.php
          fi
          dart run test/engine_test.dart
          dart run test/mcp_test.dart
          AE_TEST_VISION_MODEL=$(ls $GITHUB_WORKSPACE/testmodels/vlm-model.gguf) \
          AE_TEST_MMPROJ=$GITHUB_WORKSPACE/testmodels/vlm-mmproj.gguf \
          AE_TEST_IMAGE=$GITHUB_WORKSPACE/third_party/llama.cpp/tools/mtmd/test-1.jpeg \
          AE_TEST_SD_MODEL=$GITHUB_WORKSPACE/testmodels/sd_turbo.gguf \
          AE_TEST_HYBRID_MODEL=$GITHUB_WORKSPACE/testmodels/hybrid.gguf \
          AE_TEST_OUT=$GITHUB_WORKSPACE/testout \
          dart run test/media_test.dart
      - name: Download-Adressen prüfen
        working-directory: packages/agent_engine
        run: dart run tool/check_catalog.dart
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Engine-Test-Ausgaben
          path: testout
          if-no-files-found: ignore
          retention-days: 7
