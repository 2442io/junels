# Baut bei jedem Push die Android-APK und die macOS-DMG.
# Downloads: Reiter "Actions" → letzter Lauf → "Artifacts".
# Bei einem Tag (z. B. v1.1.0) zusätzlich als GitHub-Release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android-APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Quellen holen (llama.cpp, whisper.cpp)
        run: bash scripts/fetch_llama.sh
      - name: Plattform anlegen und anpassen
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter create --platforms=android --org io.t24 --project-name offline_agent --no-pub .
          python3 ../scripts/patch_platforms.py .
          flutter pub get
      - name: APK bauen
        run: bash scripts/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineAgent-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

  macos:
    name: macOS-DMG
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Werkzeuge
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          flutter config --no-analytics
      - name: Einrichten (inkl. Metal-Framework, nur macOS-Variante)
        env:
          AE_APPLE_TARGETS: macos
        run: bash scripts/setup.sh
      - name: DMG bauen
        run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineAgent-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
