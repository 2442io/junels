name: UX-Bilder

# Rendert alle Seiten in Handy-Größe mit Beispieldaten (zum Prüfen von Aufbau und Bedienbarkeit).
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bilder rendern
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter pub get
          mkdir -p test/ux
          flutter test test/ux_shots_test.dart --update-goldens --reporter expanded 2>&1 | grep -E "Bild|Fertig|init-Fehler|Error|error" | head -120 || true
          ls -la test/ux
          pip install --quiet pillow
          python3 -c "
          import glob,base64,io
          from PIL import Image
          for f in sorted(glob.glob('test/ux/*.png')):
              im=Image.open(f).convert('RGB')
              if im.width > 900: im=im.resize((im.width*2//3, im.height*2//3))
              b=io.BytesIO(); im.save(b,'JPEG',quality=68)
              d=base64.b64encode(b.getvalue()).decode()
              print('IMG-BEGIN',f.split('/')[-1])
              for i in range(0,len(d),3000): print(d[i:i+3000])
              print('IMG-END')
          "
      - uses: actions/upload-artifact@v6
        with:
          name: ux-bilder
          path: app/test/ux/*.png
          if-no-files-found: warn
          retention-days: 3
